name: Verify campus market
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/
      TEST_REDIS_ADDR: 127.0.0.1:6379
      E2E_MYSQL_DSN_BASE: root:root@tcp(127.0.0.1:3306)/
      E2E_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend validation (MySQL 8 + Redis 7 integration tests, race detector)
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
          go build ./cmd/server
      - name: Flash sale load & consistency check
        working-directory: backend
        run: |
          mysql_dsn='root:root@tcp(127.0.0.1:3306)/campus_bench'
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS campus_bench CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"
          go build -o /tmp/campus ./cmd/server
          go build -o /tmp/flashbench ./cmd/flashbench
          DATABASE_DSN="$mysql_dsn" REDIS_ADDR=127.0.0.1:6379 REDIS_PREFIX=bench TRUSTED_PROXY_CIDRS=127.0.0.1/32 /tmp/campus > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/api/v1/health && break; sleep 1; done
          DATABASE_DSN="$mysql_dsn" REDIS_PREFIX=bench /tmp/flashbench -users 3000 -stock 200 -c 200
      - name: Dependencies and unit tests
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Browser acceptance
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Container build
        run: |
          docker build --target api -t campus-api:test .
          docker build --target web -t campus-web:test .
