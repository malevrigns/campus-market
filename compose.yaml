services:
  api:
    build:
      context: .
      target: api
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      HTTP_ADDR: :8081
      DATABASE_PATH: /data/campus.db
      UPLOAD_DIR: /data/uploads
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      TRUSTED_PROXY_CIDRS: 172.30.250.0/24
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      ALIPAY_PRIVATE_KEY_FILE: ${ALIPAY_PRIVATE_KEY_FILE:-}
      ALIPAY_PUBLIC_KEY_FILE: ${ALIPAY_PUBLIC_KEY_FILE:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      AGENT_CONNECTIONS_FILE: ${AGENT_CONNECTIONS_FILE:-}
    volumes:
      - campus-data:/data
      - ./secrets:/run/secrets:ro
    networks: [campus]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /usr/local/bin/campus, --healthcheck]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 20s
    mem_limit: 768m
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [campus]
    depends_on:
      api: { condition: service_healthy }
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  campus-data:
  caddy-data:
  caddy-config:
networks:
  campus:
    ipam:
      config: [{ subnet: 172.30.250.0/24 }]
