<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>edu-mall 微服务控制台</title>

<body>
<h1>🛒 edu-mall · Go 微服务实战控制台</h1>
<div class="sub">商城 × WebSocket × IM × AI Agent —— 点击按钮调用真实运行中的服务，查看返回。所有请求走 localhost。</div>
<div class="grid" id="grid"></div>
<script>
const SERVICES=[
 {name:"🛒 商城 mall",port:"8081",desc:"订单状态机 / 防超卖 / 支付回调幂等(验签HMAC+验金额)",btns:[
   ["创建订单","POST","http://127.0.0.1:8081/api/v1/orders",{user_id:"u1",idempotency_key:"k-"+Date.now(),items:[{sku_id:"sku-golang-course",name:"Go课程",price_ct:99900,qty:1}],server_side_prices:{"sku-golang-course":99900}}],
   ["支付回调(验签)","POST","http://127.0.0.1:8081/payments/notify","__PAY__"],
   ["查询订单","GET","http://127.0.0.1:8081/api/v1/orders?no=__NO__",null],
 ]},
 {name:"💬 IM im",port:"8082",desc:"seq单调递增 / clientMsgId去重 / 游标增量同步",btns:[
   ["建会话 c-demo","POST","http://127.0.0.1:8082/api/v1/conv",{id:"c-demo",type:"group",members:["a","b"]}],
   ["a发消息(seq+1)","POST","http://127.0.0.1:8082/api/v1/messages",{sender:"a",conv_id:"c-demo",client_msg_id:"cm-"+Date.now(),type:0,content:"你好"}],
   ["b拉取历史","GET","http://127.0.0.1:8082/api/v1/messages/sync?user=b&conv=c-demo&after_seq=0&limit=50",null],
 ]},
 {name:"🔌 WebSocket ws",port:"8083",desc:"在线状态(TTL) / SendToUser扇出(排除发送者)",btns:[
   ["a连接 conn-1","POST","http://127.0.0.1:8083/api/v1/ws/connect",{UserID:"a",ConnID:"a-1",NodeID:"n1"}],
   ["a连接 conn-2","POST","http://127.0.0.1:8083/api/v1/ws/connect",{UserID:"a",ConnID:"a-2",NodeID:"n1"}],
   ["查a在线状态","GET","http://127.0.0.1:8083/api/v1/ws/online?user=a",null],
   ["全局计数","GET","http://127.0.0.1:8083/api/v1/ws/online",null],
   ["b→a推送(扇出)","POST","http://127.0.0.1:8083/api/v1/ws/send",{user_id:"a",payload:"hi from b"}],
 ]},
 {name:"🤖 AI Agent agent",port:"8084",desc:"SSE流式 ReAct / Policy治理(未绑定能力会中断) / Guardrail",btns:[
   ["跑一次Agent(SSE流)","POST","http://127.0.0.1:8084/v1/agent/run",{run_id:"run-"+Date.now(),agent_id:"demo-agent",prompt:"帮我查一下我的订单",scopes:["order.read","order.refund"]}],
 ]},
];
const grid=document.getElementById('grid');let lastOrderNo=null;
SERVICES.forEach(svc=>{
 const card=document.createElement('div');card.className='card';
 card.innerHTML='<h2>'+svc.name+'<span class="port">:'+svc.port+'</span></h2><div class="desc">'+svc.desc+'</div><div class="btns"></div>';
 const btns=card.querySelector('.btns');
 svc.btns.forEach(b=>{
   const btn=document.createElement('button');btn.textContent=b[0];if(b[1]==='POST')btn.className='run';
   btn.onclick=()=>doCall(b,card);btns.appendChild(btn);
 });
 grid.appendChild(card);
});
async function doCall(b,card){
 let pre=card.querySelector('pre');if(!pre){pre=document.createElement('pre');card.appendChild(pre);}
 let url=b[2].replace(/__NO__/g,lastOrderNo||'x'),body=b[3];
 if(body==='__PAY__'){
   if(!lastOrderNo){pre.innerHTML='<span class="err">请先点「创建订单」拿到 orderNo</span>';return;}
   const amount=99900,out='OUT-'+lastOrderNo,status='SUCCESS',canon=out+'|'+lastOrderNo+'|'+status+'|'+amount;
   const sign=await hmacSha256Hex(canon,'gateway-secret');
   url='http://127.0.0.1:8081/payments/notify';body={OutTradeNo:out,OrderNo:lastOrderNo,Status:status,AmountCt:amount,Sign:sign};
 }
 pre.innerHTML='<span class="lbl">⏳ '+b[1]+' …</span>';
 try{
   const opt={method:b[1],headers:{'Content-Type':'application/json'}};
   if(body)opt.body=JSON.stringify(body);
   const resp=await fetch(url,opt),text=await resp.text();
   if(b[0]==='创建订单'){try{const j=JSON.parse(text);if(j.data&&j.data.no)lastOrderNo=j.data.no;}catch(e){}}
   const cls=resp.ok?'ok':'err';
   pre.innerHTML='<span class="'+cls+'">HTTP '+resp.status+'</span>\n'+escapeHtml(text)+(lastOrderNo&&b[0]==='创建订单'?'<span class="tag">→ orderNo='+lastOrderNo+' (已记住)</span>':'');
 }catch(e){pre.innerHTML='<span class="err">'+escapeHtml(String(e))+'</span>';}
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function hmacSha256Hex(msg,secret){
 const enc=new TextEncoder();
 const key=await crypto.subtle.importKey('raw',enc.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);
 const sig=await crypto.subtle.sign('HMAC',key,enc.encode(msg));
 return Array.from(new Uint8Array(sig)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
</script>
</body>
</html>
